server:
  port: 9001

spring:
  application:
    name: explore-chat
  security:
    oauth2:
      resourceserver:
        jwt:
          # Explore IAM access tokens (native Sign in with IAM). Blank CHAT_IAM_ISSUER_URI turns off validation.
          issuer-uri: ${CHAT_IAM_ISSUER_URI:}
          authorities-claim-name: scope
          authority-prefix: SCOPE_
  datasource:
    url: jdbc:h2:file:./data/explore-chat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: com.chat.common.config.ChatPhysicalNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

chat:
  jwt:
    access-secret: "dev-access-secret-change-me-32bytes!!"
    refresh-secret: "dev-refresh-secret-change-me-32byte"
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 604800
  kafka:
    # Empty KAFKA_BOOTSTRAP_SERVERS disables Kafka (no-op publisher). Unset defaults to localhost:9092.
    brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic-offline-messages: ${KAFKA_TOPIC_OFFLINE_MESSAGES:offline-messages}
    topic-post-created: ${KAFKA_TOPIC_POST_CREATED:post.created}
    topic-post-deleted: ${KAFKA_TOPIC_POST_DELETED:post.deleted}
    topic-feed-fanout: ${KAFKA_TOPIC_FEED_FANOUT:feed.fanout}
    topic-comment-created: ${KAFKA_TOPIC_COMMENT_CREATED:comment.created}
    topic-analytics-events: ${KAFKA_TOPIC_ANALYTICS_EVENTS:analytics.events}
    client-id: explore-chat-server
    consumer-group: explore-chat
  socketio:
    host: 0.0.0.0
    port: 9002
    context: /socket.io
  media:
    upload-dir: uploads
    public-base-url: http://localhost:9001/uploads
  upstreams:
    explore-ml: ${EXPLORE_ML_API_URL:http://localhost:8000}
    ollama: http://localhost:11434
    explore-ai: ${EXPLORE_AI_BASE_URL:http://127.0.0.1:9000}
    explore-ai-service-key: ${EXPLORE_AI_SERVICE_KEY:}

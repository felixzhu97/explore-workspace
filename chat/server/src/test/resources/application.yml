chat:
  socketio:
    enabled: false
  demo-seed: false
  kafka:
    brokers: []

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
  datasource:
    url: jdbc:h2:mem:explore-chat-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: com.chat.common.config.ChatPhysicalNamingStrategy
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

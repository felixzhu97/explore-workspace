name: ai iOS

on:
  push:
    branches: [main]
    paths: &paths
      - "ai/ios/**"
      - "!ai/ios/**/*.md"
      - ".github/workflows/ai-ios.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ai/ios
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          xcodebuild \
            -project AI.xcodeproj \
            -scheme AI \
            -destination "platform=iOS Simulator,id=${UDID}" \
            CODE_SIGNING_ALLOWED=NO \
            test

packages:
  - "*/*"
  # chat analytics SDK lives one level deeper than */*
  - "chat/packages/*"

catalog:
  "@eslint/js": 10.0.1
  "@nx/devkit": 24.0.6
  "@nx/eslint": 24.0.6
  "@nx/eslint-plugin": 24.0.6
  "@nx/gradle": 24.0.6
  eslint: 10.14.0
  nx: 24.0.6
  typescript: ~6.0.3
  typescript-eslint: 8.72.2
  yaml: 2.9.1

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  protobufjs: set this to true or false
  sharp: set this to true or false

# https://pnpm.io/settings#overrides
overrides:
  # Mermaid → chevrotain still pulls lodash-es@4.17.23 (GHSA-r5fr-rjxr-66jc / GHSA-f23m-r3pf-42rh).
  lodash-es: '>=4.17.24'
  # @a2ui/* needs zod 3; Zod 4 breaks its ZodTypeAny / ComponentApi types.
  '@a2ui/angular>zod': '^3.25.76'
  '@a2ui/web_core>zod': '^3.25.76'

packages:
  - "*/*"
  # chat analytics SDK lives one level deeper than */*
  - "chat/packages/*"
  - "commerce/packages/*"
  - "commerce/services/*"
  - "commerce/apps/*"
  - "commerce/scripts"
  - "commerce/server"
  - "portfolio/packages/*"
  - "portfolio/admin"
  - "portfolio/portal"
  - "portfolio/mobile"

catalog:
  "@eslint/js": 10.0.1
  "@nx/devkit": 24.0.6
  "@nx/eslint": 24.0.6
  "@nx/eslint-plugin": 24.0.6
  "@nx/gradle": 24.0.6
  eslint: 10.14.0
  nx: 24.0.6
  typescript: ~6.0.3
  typescript-eslint: 8.72.2
  yaml: 2.9.1

allowBuilds:
  '@datadog/native-appsec': false
  '@datadog/native-iast-taint-tracking': false
  '@datadog/native-metrics': false
  '@datadog/pprof': false
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  aws-sdk: false
  better-sqlite3: false
  core-js-pure: false
  dd-trace: false
  es5-ext: false
  esbuild: true
  lmdb: true
  mongodb-memory-server: false
  msgpackr-extract: true
  nx: true
  protobufjs: true
  serverless: false
  sharp: true

# https://pnpm.io/settings#overrides
overrides:
  lodash-es: '>=4.17.24'
  '@a2ui/angular>zod': '^3.25.76'
  '@a2ui/web_core>zod': '^3.25.76'
